<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login — Portfolio CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(108,92,231,0.08) 1px, transparent 0);
      background-size: 40px 40px;
    }
    .bg-glow {
      position: fixed; width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(108,92,231,0.12) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0;
    }
    .login-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px; padding: 48px 40px;
      background: rgba(22, 22, 31, 0.8);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.5);
    }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
    .login-logo .dot { color: #6c5ce7; }
    .login-logo p { color: #6b6b80; font-size: 0.875rem; margin-top: 8px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.8125rem; font-weight: 600; color: #9494a8; margin-bottom: 8px; }
    .form-group input {
      width: 100%; padding: 14px 16px;
      background: #0a0a0f; border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; color: #f0f0f5; font-size: 0.9375rem;
      font-family: 'Inter', sans-serif; outline: none; transition: 0.2s;
    }
    .form-group input:focus { border-color: #6c5ce7; box-shadow: 0 0 0 3px rgba(108,92,231,0.3); }
    .form-group input::placeholder { color: #6b6b80; }
    .btn-login {
      width: 100%; padding: 14px; background: #6c5ce7; color: white;
      border: none; border-radius: 8px; font-size: 0.9375rem; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer; transition: 0.3s;
      box-shadow: 0 4px 15px rgba(108,92,231,0.3);
    }
    .btn-login:hover { background: #a29bfe; box-shadow: 0 4px 25px rgba(108,92,231,0.5); transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg {
      display: none; padding: 12px 16px; background: rgba(255,71,87,0.1);
      border: 1px solid rgba(255,71,87,0.2); border-radius: 8px;
      color: #ff6b81; font-size: 0.8125rem; margin-bottom: 20px;
    }
    .back-link { text-align: center; margin-top: 24px; }
    .back-link a { color: #6b6b80; font-size: 0.8125rem; text-decoration: none; transition: 0.2s; }
    .back-link a:hover { color: #a29bfe; }
    @media (max-width: 480px) { .login-card { margin: 16px; padding: 32px 24px; } }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="login-card">
    <div class="login-logo">
      <h1>SJ<span class="dot">.</span></h1>
      <p>Portfolio Control Center</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@portfolio.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>
    <div class="back-link"><a href="/">← Back to Portfolio</a></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');
      btn.disabled = true; btn.textContent = 'Signing in...';
      errEl.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('auth_token', data.token);
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
    });
    // Check if already logged in
    if (localStorage.getItem('auth_token')) {
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + localStorage.getItem('auth_token') } })
        .then(r => { if (r.ok) window.location.href = '/'; });
    }
  </script>
</body>
</html>
